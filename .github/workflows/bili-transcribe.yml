name: bili-transcribe

on:
  push:
    branches: [claude/bili-transcribe]
    paths: [tools/bili/**, .github/workflows/bili-transcribe.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -q "requests[socks]" yt-dlp faster-whisper opencc-python-reimplemented

      - name: Fetch directly
        run: |
          BV=$(tr -d '[:space:]' < tools/bili/job.txt)
          echo "BV=$BV" >> "$GITHUB_ENV"
          echo "DIR=results/$BV" >> "$GITHUB_ENV"
          python tools/bili/fetch.py "$BV" "results/$BV" || echo "direct fetch failed"

      - name: Fetch via Cloudflare WARP proxy
        if: hashFiles(format('{0}/audio.m4a', env.DIR)) == ''
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflare-warp
          sleep 3
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          sleep 8
          curl -s -x socks5h://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep -E 'ip=|warp=' || true
          BILI_PROXY=socks5h://127.0.0.1:40000 python tools/bili/fetch.py "$BV" "$DIR" || echo "warp fetch failed"
          if [ ! -s "$DIR/audio.m4a" ]; then
            echo "API audio failed, trying yt-dlp via WARP"
            yt-dlp --proxy socks5://127.0.0.1:40000 -f bestaudio -o "$DIR/audio.m4a" "https://www.bilibili.com/video/$BV" || true
          fi
          ls -la "$DIR" || true

      - name: Transcribe
        run: |
          if [ -s "$DIR/subtitles.txt" ] && [ "$(wc -l < "$DIR/subtitles.txt")" -gt 20 ]; then
            echo "Platform subtitles found; skipping ASR"
            exit 0
          fi
          DUR=$(python -c "import json;print(json.load(open('$DIR/meta.json'))['duration'])" 2>/dev/null || echo 0)
          python tools/bili/transcribe.py "$DIR/audio.m4a" "$DIR" "$DUR"

      - name: Commit results
        if: always()
        run: |
          rm -f results/*/audio.*
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add results
          git commit -m "bili: results for $BV [skip ci]" || exit 0
          git push
