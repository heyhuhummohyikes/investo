name: bili-transcribe

on:
  push:
    branches: [claude/bili-transcribe]
    paths: [tools/bili/**, .github/workflows/bili-transcribe.yml]
  workflow_dispatch:

permissions:
  contents: write

env:
  CHUNK_SECONDS: 420

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      chunks: ${{ steps.split.outputs.list }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -q "requests[socks]" yt-dlp
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Fetch directly
        id: direct
        run: |
          BV=$(tr -d '[:space:]' < tools/bili/job.txt)
          DIR="results/$BV"
          echo "BV=$BV" >> "$GITHUB_ENV"
          echo "DIR=$DIR" >> "$GITHUB_ENV"
          python tools/bili/fetch.py "$BV" "$DIR" || echo "direct fetch failed"
          if [ ! -s "$DIR/audio.m4a" ]; then
            echo "API audio failed, trying yt-dlp"
            yt-dlp --http-chunk-size 1M --retries 10 -f bestaudio -o "$DIR/audio.m4a" "https://www.bilibili.com/video/$BV" || true
          fi
          if [ -s "$DIR/audio.m4a" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; fi

      - name: Fetch via Cloudflare WARP proxy
        if: steps.direct.outputs.ok != '1'
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflare-warp
          sleep 3
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          sleep 8
          BILI_PROXY=socks5h://127.0.0.1:40000 python tools/bili/fetch.py "$BV" "$DIR" || echo "warp fetch failed"
          if [ ! -s "$DIR/audio.m4a" ]; then
            yt-dlp --proxy socks5://127.0.0.1:40000 --http-chunk-size 1M --retries 10 -f bestaudio -o "$DIR/audio.m4a" "https://www.bilibili.com/video/$BV" || true
          fi

      - name: Split audio
        id: split
        run: |
          ls -la "$DIR"
          mkdir -p chunks
          ffmpeg -nostdin -loglevel error -i "$DIR/audio.m4a" -ac 1 -ar 16000 \
            -f segment -segment_time "$CHUNK_SECONDS" -reset_timestamps 1 chunks/c%02d.wav
          rm -f "$DIR"/audio.*
          ls -la chunks
          echo "list=$(ls chunks | sed 's/\.wav$//' | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: results

      - uses: actions/upload-artifact@v4
        with:
          name: chunks
          path: chunks
          retention-days: 1

  asr:
    needs: fetch
    if: needs.fetch.outputs.chunks != '' && needs.fetch.outputs.chunks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.fetch.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: chunks
          path: chunks

      - name: Install
        run: pip install -q faster-whisper opencc-python-reimplemented numpy

      - name: Transcribe ${{ matrix.chunk }}
        env:
          CHUNK: ${{ matrix.chunk }}
          WHISPER_MODEL: large-v3-turbo
        run: |
          IDX=${CHUNK#c}
          OFFSET=$((10#$IDX * CHUNK_SECONDS))
          python tools/bili/transcribe.py "chunks/$CHUNK.wav" "tx/$CHUNK.txt" "$OFFSET"

      - uses: actions/upload-artifact@v4
        with:
          name: tx-${{ matrix.chunk }}
          path: tx

  merge:
    needs: [fetch, asr]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: results
          path: results

      - uses: actions/download-artifact@v4
        with:
          pattern: tx-*
          merge-multiple: true
          path: tx

      - name: Merge and commit
        run: |
          BV=$(tr -d '[:space:]' < tools/bili/job.txt)
          ls tx || true
          if ls tx/c*.txt >/dev/null 2>&1; then
            cat $(ls tx/c*.txt | sort) > "results/$BV/transcript.txt"
            wc -l "results/$BV/transcript.txt"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add results
          git commit -m "bili: results for $BV [skip ci]" || exit 0
          git pull --rebase -q origin "$GITHUB_REF_NAME"
          git push
