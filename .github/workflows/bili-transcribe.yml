name: bili-transcribe

on:
  push:
    branches: [claude/bili-transcribe]
    paths: [tools/bili/**, .github/workflows/bili-transcribe.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -q requests yt-dlp faster-whisper opencc-python-reimplemented

      - name: Fetch metadata, subtitles, comments, audio
        run: |
          BV=$(tr -d '[:space:]' < tools/bili/job.txt)
          echo "BV=$BV" >> "$GITHUB_ENV"
          python tools/bili/fetch.py "$BV" "results/$BV"
          if [ ! -s "results/$BV/audio.m4a" ]; then
            echo "API audio failed, trying yt-dlp"
            yt-dlp -f bestaudio -o "results/$BV/audio.m4a" "https://www.bilibili.com/video/$BV" || true
          fi
          ls -la "results/$BV"

      - name: Transcribe
        run: |
          DIR="results/$BV"
          if [ -s "$DIR/subtitles.txt" ] && [ "$(wc -l < "$DIR/subtitles.txt")" -gt 20 ]; then
            echo "Platform subtitles found; skipping ASR"
            exit 0
          fi
          DUR=$(python -c "import json;print(json.load(open('$DIR/meta.json'))['duration'])")
          python tools/bili/transcribe.py "$DIR/audio.m4a" "$DIR" "$DUR"

      - name: Commit results
        if: always()
        run: |
          rm -f results/*/audio.*
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add results
          git commit -m "bili: results for $BV [skip ci]" || exit 0
          git push
